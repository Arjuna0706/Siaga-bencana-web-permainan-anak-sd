mutation CreateUser @auth(level: USER) {
  user_insert(data: {id_expr: "auth.uid", username: "new_user", createdAt_time: {now: true}})
}

mutation UpdateUser @auth(level: USER) {
  user_update(key: {id_expr: "auth.uid"}, data: {username: "updated_username"})
}

mutation DeleteUser @auth(level: USER) {
  user_delete(key: {id_expr: "auth.uid"})
}

query GetUser @auth(level: USER) {
  user(key: {id_expr: "auth.uid"}) {
    username
    createdAt
  }
}

query ListUsers @auth(level: PUBLIC, insecureReason: "Listing public user profiles is allowed.") {
  users(limit: 10) {
    username
    avatarUrl
  }
}

mutation CreateGameSession @auth(level: USER) {
  gameSession_insert(data: {
    currentLevel: 1,
    score: "0",
    updatedAt_time: {now: true},
    user: {id_expr: "auth.uid"}
  })
}

mutation UpdateGameSession @auth(level: USER) {
  gameSession_update(
    first: {where: {user: {id: {eq_expr: "auth.uid"}}}},
    data: {score_update: [{inc: "100"}]}
  )
}

mutation DeleteGameSession @auth(level: USER) {
  gameSession_delete(first: {where: {user: {id: {eq_expr: "auth.uid"}}}})
}

query GetGameSession @auth(level: USER) {
  gameSession(first: {where: {user: {id: {eq_expr: "auth.uid"}}}}) {
    score
    currentLevel
  }
}

query ListGameSessions @auth(level: USER) {
  gameSessions(where: {user: {id: {eq_expr: "auth.uid"}}}) {
    id
    score
  }
}

mutation CreateAchievement @auth(level: USER) {
  achievement_insert(data: {
    name: "First Win",
    unlockedAt_time: {now: true},
    user: {id_expr: "auth.uid"}
  })
}

mutation DeleteAchievement @auth(level: USER) {
  achievement_delete(first: {where: {user: {id: {eq_expr: "auth.uid"}}}})
}

query ListAchievements @auth(level: USER) {
  achievements(where: {user: {id: {eq_expr: "auth.uid"}}}) {
    name
    unlockedAt
  }
}

mutation UpsertLeaderboardEntry @auth(level: USER) {
  leaderboardEntry_upsert(data: {
    highScore: "1000",
    updatedAt_time: {now: true},
    user: {id_expr: "auth.uid"}
  })
}

query ListLeaderboard @auth(level: PUBLIC, insecureReason: "Leaderboards are intended to be public.") {
  leaderboardEntries(orderBy: [{highScore: DESC}], limit: 50) {
    highScore
    user { username }
  }
}

query GetGameConfig @auth(level: PUBLIC, insecureReason: "Public game settings required by client.") {
  gameConfigs {
    configName
    settingsValue
  }
}

mutation UpdateGameConfig @auth(expr: "auth.token.admin == true") {
  gameConfig_update(first: {where: {configName: {eq: "difficulty"}}}, data: {settingsValue: "hard"})
}